# Dovecot configuration for closed IPv6 literal mail service
# Plaintext protocols are allowed because the network is fully trusted.

protocols = imap lmtp
listen = *

# Mail is stored per rewritten recipient; userdb sets each user's home under
# /var/mail/vhosts/internal.invalid/<localpart> and mail is kept in ~/Maildir.
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid = 5000

# Disable SSL/TLS because traffic never leaves the secure segment.
ssl = no

# Authentication blocks are managed in conf.d/10-auth.conf.
!include conf.d/*.conf

# Expose authentication and LMTP sockets for Postfix integration.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service lmtp {
  user = vmail
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
